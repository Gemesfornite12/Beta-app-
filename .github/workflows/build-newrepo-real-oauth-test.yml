name: Build real OAuth test APK from Betaapkdebug-

on:
  push:
    branches:
      - zapia/test-newrepo-real-oauth-20260930
    paths:
      - '.github/workflows/build-newrepo-real-oauth-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source/Beta-app--main
    steps:
      - name: Checkout source from test repository
        uses: actions/checkout@v4
        with:
          repository: Gemesfornite12/Betaapkdebug-
          ref: b801ec781d53eeb6e1c2fb276015f4911cf6d8a1
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Firebase test client config
        env:
          TEST_GOOGLE_SERVICES_JSON_B64: ${{ secrets.TEST_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$TEST_GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$TEST_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Restore the registered test signing key
        env:
          TEST_OAUTH_KEYSTORE_B64: ${{ secrets.TEST_OAUTH_KEYSTORE_B64 }}
          TEST_OAUTH_KEYSTORE_PASSWORD: ${{ secrets.TEST_OAUTH_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TEST_OAUTH_KEYSTORE_B64"
          test -n "$TEST_OAUTH_KEYSTORE_PASSWORD"
          printf '%s' "$TEST_OAUTH_KEYSTORE_B64" | base64 --decode > test-signing.p12
          keytool -importkeystore -noprompt \
            -srckeystore test-signing.p12 -srcstoretype PKCS12 \
            -srcstorepass "$TEST_OAUTH_KEYSTORE_PASSWORD" -srcalias androiddebugkey \
            -destkeystore debug.keystore -deststoretype JKS \
            -deststorepass android -destkeypass android -destalias androiddebugkey
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -A1 'SHA1:'

      - name: Build isolated .test APK
        run: gradle assembleDebug --stacktrace

      - name: Run connector and media-routing tests
        run: gradle testDebugUnitTest --tests com.example.data.api.GroqWorkspaceConnectorTest --tests com.example.ui.viewmodel.GroqMediaRoutingTest --tests com.example.data.api.GoogleWorkspaceActionsApiTest --stacktrace

      - name: Upload real-connection test APK (24h)
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-real-oauth-test-apk
          path: source/Beta-app--main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove Firebase config and signing material
        if: always()
        run: rm -f app/google-services.json test-signing.p12 debug.keystore
