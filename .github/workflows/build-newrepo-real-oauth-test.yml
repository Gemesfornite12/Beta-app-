name: Build OmniStudio test APK with Workspace actions

on:
  push:
    branches:
      - zapia/test-newrepo-real-oauth-20260930
    paths:
      - '.github/workflows/build-newrepo-real-oauth-test.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:
    inputs:
      publish_direct_apk:
        description: Publish the isolated test APK as a public direct-download prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout the isolated OmniStudio test branch
        uses: actions/checkout@v4
        with:
          repository: Gemesfornite12/Beta-app-
          ref: zapia/test-newrepo-real-oauth-20260930
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Firebase test client config
        env:
          TEST_GOOGLE_SERVICES_JSON_B64: ${{ secrets.TEST_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$TEST_GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$TEST_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Restore the registered test signing key
        env:
          TEST_OAUTH_KEYSTORE_B64: ${{ secrets.TEST_OAUTH_KEYSTORE_B64 }}
          TEST_OAUTH_KEYSTORE_PASSWORD: ${{ secrets.TEST_OAUTH_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TEST_OAUTH_KEYSTORE_B64"
          test -n "$TEST_OAUTH_KEYSTORE_PASSWORD"
          printf '%s' "$TEST_OAUTH_KEYSTORE_B64" | base64 --decode > test-signing.p12
          keytool -importkeystore -noprompt \
            -srckeystore test-signing.p12 -srcstoretype PKCS12 \
            -srcstorepass "$TEST_OAUTH_KEYSTORE_PASSWORD" -srcalias androiddebugkey \
            -destkeystore debug.keystore -deststoretype JKS \
            -deststorepass android -destkeypass android -destalias androiddebugkey
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -A1 'SHA1:'

      - name: Build isolated .test APK
        run: gradle assembleDebug --stacktrace

      - name: Verify .test APK package and registered signer
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE="$("$AAPT" dump badging "$APK" | awk -F"'" '/^package:/ {print $2; exit}')"
          echo "Beta APK package: ${PACKAGE:-<missing>}"
          test "$PACKAGE" = "com.aistudio.omnistudio.wkspea.test"
          APK_SHA256="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | awk -F': ' '/certificate SHA-256 digest:/ {gsub(/:/, "", $NF); print tolower($NF); exit}')"
          KEY_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA256:/ {gsub(/:/, "", $NF); print tolower($NF); exit}')"
          echo "APK signer SHA-256: ${APK_SHA256:-<missing>}"
          echo "Registered test-key SHA-256: ${KEY_SHA256:-<missing>}"
          test -n "$APK_SHA256"
          test -n "$KEY_SHA256"
          test "$APK_SHA256" = "$KEY_SHA256"
          echo "Verified Beta package and registered signer match"

      - name: Run connector and media-routing tests
        run: gradle testDebugUnitTest --tests com.example.data.api.GroqWorkspaceConnectorTest --tests com.example.ui.viewmodel.GroqMediaRoutingTest --tests com.example.data.api.GoogleWorkspaceActionsApiTest --tests com.example.ui.screens.ai.GoogleWorkspaceCommandParserTest --tests com.example.data.supabase.SupabaseUploadPermissionTest --stacktrace

      - name: Upload unit test report after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-report
          path: source/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload real-connection test APK (24h)
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-real-oauth-test-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove Firebase config and signing material
        if: always()
        run: rm -f app/google-services.json test-signing.p12 debug.keystore

  publish-direct-test-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_direct_apk == true
    needs: build-test-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the freshly built .test APK
        uses: actions/download-artifact@v4
        with:
          name: omnistudio-real-oauth-test-apk
          path: release_asset

      - name: Publish a separate test-only prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zapia-social-test-20261001
          name: OmniStudio Social .test APK (2026-10-01)
          body: |-
            Temporary direct-download APK to test OmniStudio Social features from the isolated .test branch.
            This is not the production APK or a Play Store release.
          target_commitish: zapia/test-newrepo-real-oauth-20260930
          prerelease: true
          draft: false
          files: release_asset/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
