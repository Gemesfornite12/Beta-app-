name: RTDB exact-handle directory emulator

on:
  push:
    branches:
      - draft/rtdb-rules-only-exact-handle-directory-20261010
    paths:
      - experiments/rules-only-exact-handle-directory/database.rules.json
      - experiments/rules-only-exact-handle-directory/firebase.json
      - experiments/rules-only-exact-handle-directory/package.json
      - experiments/rules-only-exact-handle-directory/test/rules.test.js
      - .github/workflows/rtdb-handle-directory-emulator.yml

permissions:
  contents: read

jobs:
  emulator-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned npm dependencies
        working-directory: experiments/rules-only-exact-handle-directory
        run: npm install --no-audit --no-fund
      - name: Run RTDB Emulator Suite rules tests
        working-directory: experiments/rules-only-exact-handle-directory
        run: npm run test:emulator
