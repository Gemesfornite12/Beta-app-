name: Compare OmniStudio APK installation metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java and Android tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install APK inspection tools
        run: sdkmanager --install 'build-tools;36.0.0'
      - name: Download current and prior principal APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p apks/current apks/prior-aichat apks/prior-received-sending apks/prior-beta2 apks/prior-original
          gh release download omnistudio-fcm-review-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'OmniStudio-main.apk' --dir apks/current
          gh release download omnistudio-fcm-review-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'OmniStudio-test.apk' --dir apks/current
          gh release download Betaaichat --repo "$GITHUB_REPOSITORY" --pattern 'OmniStudio_1.0.1.apk' --dir apks/prior-aichat
          gh release download BetaworkingReceivedsending --repo "$GITHUB_REPOSITORY" --pattern 'base.3.apk' --dir apks/prior-received-sending
          gh release download Beta2 --repo "$GITHUB_REPOSITORY" --pattern 'base.2.apk' --dir apks/prior-beta2
          gh release download OmniStudio --repo "$GITHUB_REPOSITORY" --pattern 'base.1.apk' --dir apks/prior-original
      - name: Compare package, version and signing certificates
        run: |
          set -eu
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          for file in apks/current/OmniStudio-main.apk apks/current/OmniStudio-test.apk apks/prior-aichat/OmniStudio_1.0.1.apk apks/prior-received-sending/base.3.apk apks/prior-beta2/base.2.apk apks/prior-original/base.1.apk; do
            echo "FILE: $file"
            "$AAPT" dump badging "$file" | head -n 1
            "$APKSIGNER" verify --verbose --print-certs "$file" 2>&1 || true
          done
