name: omnistudio-test-only-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected test branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Firebase client config from Actions secret
        env:
          TEST_GOOGLE_SERVICES_JSON_B64: ${{ secrets.TEST_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$TEST_GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$TEST_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Restore isolated test signing key
        env:
          TEST_OAUTH_KEYSTORE_B64: ${{ secrets.TEST_OAUTH_KEYSTORE_B64 }}
          TEST_OAUTH_KEYSTORE_PASSWORD: ${{ secrets.TEST_OAUTH_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TEST_OAUTH_KEYSTORE_B64"
          test -n "$TEST_OAUTH_KEYSTORE_PASSWORD"
          printf '%s' "$TEST_OAUTH_KEYSTORE_B64" | base64 --decode > test-signing.p12
          keytool -importkeystore -noprompt \
            -srckeystore test-signing.p12 -srcstoretype PKCS12 \
            -srcstorepass "$TEST_OAUTH_KEYSTORE_PASSWORD" -srcalias androiddebugkey \
            -destkeystore debug.keystore -deststoretype JKS \
            -deststorepass android -destkeypass android -destalias androiddebugkey
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -A1 'SHA1:'

      - name: Build test-only debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run connector routing tests
        run: gradle testDebugUnitTest --tests com.example.data.api.GroqWorkspaceConnectorTest --tests com.example.ui.viewmodel.GroqMediaRoutingTest --stacktrace

      - name: Upload test-only APK (one-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-test-only-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove Firebase config and signing material from runner workspace
        if: always()
        run: rm -f app/google-services.json test-signing.p12 debug.keystore
