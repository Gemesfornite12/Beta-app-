name: android-groq-workspace-connectors

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'docs/groq-workspace-connectors.md'
      - '.github/workflows/android-groq-workspace-connectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate temporary debug signing key
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Create temporary Firebase config for build only
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "omnistudio-ci-placeholder",
              "storage_bucket": "omnistudio-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.omnistudio.wkspea"
                  }
                },
                "api_key": [
                  { "current_key": "not-a-real-api-key" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run Groq workspace connector tests
        run: gradle testDebugUnitTest --tests com.example.data.api.GroqWorkspaceConnectorTest --tests com.example.ui.viewmodel.GroqMediaRoutingTest --stacktrace
