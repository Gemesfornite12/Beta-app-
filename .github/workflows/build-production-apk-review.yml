name: Build signed production APK for review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-production-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore production Firebase config and upload key
        env:
          PRODUCTION_GOOGLE_SERVICES_JSON_B64: ${{ secrets.PRODUCTION_GOOGLE_SERVICES_JSON_B64 }}
          PRODUCTION_KEYSTORE_B64: ${{ secrets.PRODUCTION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          test -n "$PRODUCTION_GOOGLE_SERVICES_JSON_B64"
          test -n "$PRODUCTION_KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$PRODUCTION_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          printf '%s' "$PRODUCTION_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s app/google-services.json
          test -s "$KEYSTORE_PATH"
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          project_info = config.get("project_info", {})
          if project_info.get("project_id") != "omnistudio-caaf5" or project_info.get("project_number") != "611449222458":
              raise SystemExit("Firebase config is not the production OmniStudio project")
          expected_app_id = "1:611449222458:android:dce2d1586b029281794c03"
          production_client = next((
              client for client in config.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.aistudio.omnistudio.wkspea"
          ), None)
          if not production_client or production_client.get("client_info", {}).get("mobilesdk_app_id") != expected_app_id:
              raise SystemExit("Firebase config does not contain the registered production Android app")
          print("Production Firebase project and Android app configuration verified")
          PY

      - name: Detect original production signing alias
        id: signing_key
        env:
          STORE_PASSWORD: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          EXPECTED_CERT_SHA256: ab501020da1132f58002396a1631189ee46ef29ea534e324ee032407ef9d37c5
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          expected = os.environ["EXPECTED_CERT_SHA256"].lower().replace(":", "")
          result = subprocess.run(
              ["keytool", "-list", "-v", "-keystore", os.environ["KEYSTORE_PATH"], "-storepass", os.environ["STORE_PASSWORD"]],
              check=True, capture_output=True, text=True,
          )
          alias = None
          found = None
          for line in (result.stdout + "\n" + result.stderr).splitlines():
              stripped = line.strip()
              if stripped.lower().startswith("alias name:"):
                  alias = stripped.split(":", 1)[1].strip()
              elif alias and stripped.lower().startswith("sha256:"):
                  digest = stripped.split(":", 1)[1].replace(":", "").strip().lower()
                  if digest == expected:
                      found = alias
                      break
                  alias = None
          if not found:
              raise SystemExit("Original production signing certificate was not found in the uploaded keystore")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"key_alias={found}\n")
          print("Original production signing certificate and alias verified")
          PY

      - name: Build signed production APK
        env:
          STORE_PASSWORD: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          KEY_ALIAS: ${{ steps.signing_key.outputs.key_alias }}
        run: gradle assembleRelease --stacktrace

      - name: Verify original production signing certificate
        env:
          EXPECTED_CERT_SHA256: ab501020da1132f58002396a1631189ee46ef29ea534e324ee032407ef9d37c5
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -s "$APK"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE" = "com.aistudio.omnistudio.wkspea"
          DIGEST="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          test "$DIGEST" = "$EXPECTED_CERT_SHA256"
          echo "Verified Principal package $PACKAGE and original production signing certificate SHA-256 $DIGEST"

      - name: Upload private review artifact (24h)
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-production-release-apk-review
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove Firebase config and signing material
        if: always()
        run: rm -f app/google-services.json my-upload-key.jks
