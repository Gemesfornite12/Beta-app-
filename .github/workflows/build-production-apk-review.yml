name: Build signed production APK for review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-production-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore production Firebase config and upload key
        env:
          PRODUCTION_GOOGLE_SERVICES_JSON_B64: ${{ secrets.PRODUCTION_GOOGLE_SERVICES_JSON_B64 || secrets.TEST_GOOGLE_SERVICES_JSON_B64 }}
          PRODUCTION_KEYSTORE_B64: ${{ secrets.PRODUCTION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          test -n "$PRODUCTION_GOOGLE_SERVICES_JSON_B64"
          test -n "$PRODUCTION_KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$PRODUCTION_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          printf '%s' "$PRODUCTION_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s app/google-services.json
          test -s "$KEYSTORE_PATH"
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if "com.aistudio.omnistudio.wkspea" not in packages:
              raise SystemExit("Firebase config does not contain the production Android package")
          print("Production Firebase package configuration verified")
          PY

      - name: Build signed production APK
        env:
          STORE_PASSWORD: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: gradle assembleRelease --stacktrace

      - name: Verify original production signing certificate
        env:
          EXPECTED_CERT_SHA256: ab501020da1132f58002396a1631189ee46ef29ea534e324ee032407ef9d37c5
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          DIGEST="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          test "$DIGEST" = "$EXPECTED_CERT_SHA256"
          echo "Original production signing certificate verified"

      - name: Upload private review artifact (24h)
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-production-release-apk-review
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove Firebase config and signing material
        if: always()
        run: rm -f app/google-services.json my-upload-key.jks
