name: Verify secure chat-media uploads

on:
  push:
    branches:
      - main
      - zapia/test-newrepo-real-oauth-20260930
    paths:
      - "supabase/functions/chat-media-access/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-chat-media-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check secure chat-media function
        run: deno check supabase/functions/chat-media-access/index.ts
      - name: Test request authorization and upload path validation
        run: deno test supabase/functions/chat-media-access/validation_test.ts
