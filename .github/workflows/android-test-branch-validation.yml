name: android-test-branch-validation

on:
  push:
    branches:
      - zapia-groq-media-android-test-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate temporary debug signing key
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Create temporary Firebase config for build only
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "omnistudio-ci-placeholder",
              "storage_bucket": "omnistudio-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.omnistudio.wkspea"
                  }
                },
                "api_key": [
                  { "current_key": "not-a-real-api-key" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run Groq-specific JVM tests
        run: gradle testDebugUnitTest --tests com.example.ui.viewmodel.GroqMediaRoutingTest --stacktrace

      - name: Run full JVM test suite
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
