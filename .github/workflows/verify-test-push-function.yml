name: Verify isolated chat push function

on:
  push:
    branches:
      - zapia/test-newrepo-real-oauth-20260930
    paths:
      - "functions/**"
      - "firebase.json"
      - "app/src/main/java/com/example/data/firebase/FcmTokenManager.kt"
      - "app/src/main/java/com/example/data/firebase/RealtimeDatabaseService.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install function dependencies
        run: npm install --no-audit --no-fund
      - name: Compile function
        run: npm run build
